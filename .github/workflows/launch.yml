# Opens the door: builds on the evening before, waits for the time in LAUNCH_AT, deploys.
# The door is 12 December 2026, 00:00 in Brussels, so the run starts at 22:30 UTC on the 11th.
# Run it by hand if the scheduled run hasn't started by 22:45 UTC.
# Once the tool is live, delete this file: CI and the nightly run take over.
name: Launch

on:
  schedule:
    - cron: '30 22 11 12 *'
  workflow_dispatch:

jobs:
  launch:
    uses: eurth-org/eurth-style/.github/workflows/tool-launch.yml@v1
    secrets: inherit
